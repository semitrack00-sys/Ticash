<!doctype html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#082b55">
  <meta name="description" content="FlupFlap Recharge — send airtime and data bundles. A service by TiCash-App.">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FlupFlap">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="pwa.css">
  <title>FlupFlap Recharge</title>
</head>
<body>
  <div id="startup" role="status">Loading FlupFlap…</div>
  <div id="offline" role="status" hidden>You’re offline. Connect to the internet to sign in or recharge.</div>
  <aside id="install" hidden aria-label="Install FlupFlap">
    <span id="install-copy">Add FlupFlap to your home screen.</span>
    <button id="install-button" type="button">Install</button>
    <button id="install-dismiss" type="button" aria-label="Dismiss installation instructions">×</button>
  </aside>
  <noscript>Enable JavaScript to use FlupFlap Recharge.</noscript>
  <script src="pwa.js" defer></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
