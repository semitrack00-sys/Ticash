name: Render admin web

on:
  pull_request:
    paths: ['apps/mobile/**', 'scripts/render-admin-build.sh', '.github/workflows/render-admin.yml']
  push:
    branches: [main]
    paths: ['apps/mobile/**', 'scripts/render-admin-build.sh', '.github/workflows/render-admin.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
        working-directory: apps/mobile
      - run: flutter analyze --no-pub
        working-directory: apps/mobile
      - run: flutter test --no-pub
        working-directory: apps/mobile
      - name: Build and verify Render publish directory
        run: bash scripts/render-admin-build.sh
