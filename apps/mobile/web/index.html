<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Send money directly to MonCash and NatCash wallets in Haiti.">
  <meta name="theme-color" content="#03155B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TiCash">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>TiCash</title>
</head>
<body>
  <script>
    // The dedicated Render administrator host must always enter the staff
    // authentication flow. Do this before Flutter starts so a fresh browser,
    // expired session, or direct root visit cannot land on the customer shell.
    if (window.location.hostname === 'ticash-admin.onrender.com' &&
        !window.location.hash) {
      window.history.replaceState(null, '', '/#/login');
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
