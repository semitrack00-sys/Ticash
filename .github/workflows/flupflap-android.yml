name: FlupFlap Android Build

on:
  push:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'
  pull_request:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flupflap

jobs:
  validate:
    name: Analyze and test FlupFlap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: python3 -m unittest discover -s tool -p 'test_release_signing.py'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-test-android:
    name: Build FlupFlap APK and AAB
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - name: Build AAB
        run: flutter build appbundle --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-android-test-builds
          if-no-files-found: error
          path: |
            apps/flupflap/build/app/outputs/flutter-apk/app-debug.apk
            apps/flupflap/build/app/outputs/bundle/debug/app-debug.aab

  native-splash:
    name: Native splash screenshot (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: build-test-android
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 36]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: flupflap-android-test-builds
          path: android-builds
      - name: Enable emulator acceleration and screenshot tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash apps/flupflap/tool/capture_android_splash.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flupflap-native-splash-api-${{ matrix.api }}
          if-no-files-found: error
          path: |
            splash-capture/splash-native.png
            splash-capture/login-native.png
            splash-capture/startup.mp4
            splash-capture/launcher.xml
            splash-capture/launcher.png
