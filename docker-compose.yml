services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticash
      POSTGRES_USER: ticash
      POSTGRES_PASSWORD: ticash_dev
    ports:
      - "5432:5432"
    volumes:
      - ticash_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticash -d ticash"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ticash:ticash_dev@postgres:5432/ticash?schema=public
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  ticash_postgres:
