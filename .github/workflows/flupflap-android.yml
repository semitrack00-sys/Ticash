name: FlupFlap Android Build

on:
  push:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'
  pull_request:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flupflap

jobs:
  validate:
    name: Analyze and test FlupFlap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter pub get
      - run: flutter analyze
      - name: Prepare UI preview fonts
        run: |
          mkdir -p "$RUNNER_TEMP/flupflap-fonts"
          cp "$(find "$FLUTTER_ROOT" -name Roboto-Regular.ttf -print -quit)" "$RUNNER_TEMP/flupflap-fonts/Roboto.ttf"
          cp "$(find "$FLUTTER_ROOT" -iname MaterialIcons-Regular.otf -print -quit)" "$RUNNER_TEMP/flupflap-fonts/materialicons-regular.otf"
      - run: flutter test
        env:
          FLUPFLAP_SCREENSHOT_DIR: ${{ github.workspace }}/flupflap-ui-preview
          FLUPFLAP_TEST_FONT: ${{ runner.temp }}/flupflap-fonts/Roboto.ttf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flupflap-plan-ui-preview
          path: flupflap-ui-preview/*.png
          if-no-files-found: ignore

  build-test-android:
    name: Build FlupFlap APK and AAB
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - name: Verify built QA manifest and plugin permissions
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print build/app/outputs/flutter-apk/app-debug.apk | python3 tool/check_android_manifest.py --allow-debug-qa
      - name: Build AAB
        run: flutter build appbundle --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-android-test-builds
          if-no-files-found: error
          path: |
            apps/flupflap/build/app/outputs/flutter-apk/app-debug.apk
            apps/flupflap/build/app/outputs/bundle/debug/app-debug.aab

  release-smoke:
    name: Validate release mode with disposable CI signing
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Provision disposable CI certificate
        run: |
          PYTHONPATH=tool python3 - <<'PY'
          import base64, os, secrets, subprocess, tempfile
          from pathlib import Path
          from prepare_release_signing import prepare
          env = dict(os.environ)
          env['CI_KEY_PASSWORD'] = secrets.token_hex(24)
          with tempfile.TemporaryDirectory() as directory:
              key = Path(directory) / 'ci-only.jks'
              subprocess.run(['keytool', '-genkeypair', '-noprompt', '-storetype', 'JKS',
                              '-keyalg', 'RSA', '-keysize', '2048', '-validity', '2',
                              '-alias', 'ci-only', '-dname', 'CN=FlupFlap CI ONLY',
                              '-keystore', str(key), '-storepass:env', 'CI_KEY_PASSWORD',
                              '-keypass:env', 'CI_KEY_PASSWORD'], env=env,
                             capture_output=True, check=True)
              env.update(RELEASE_VERSION_CODE='1', RELEASE_VERSION_NAME='0.0.0',
                         RELEASE_API_BASE_URL='https://example.invalid/api',
                         FLUPFLAP_UPLOAD_KEYSTORE_BASE64=base64.b64encode(key.read_bytes()).decode(),
                         FLUPFLAP_UPLOAD_KEY_ALIAS='ci-only',
                         FLUPFLAP_UPLOAD_KEY_PASSWORD=env['CI_KEY_PASSWORD'],
                         FLUPFLAP_UPLOAD_STORE_PASSWORD=env['CI_KEY_PASSWORD'])
              prepare('android', env)
          print('Disposable CI signing configured; this identity is only for CI validation.')
          PY
      - run: flutter pub get
      - name: Build optimized release APK and AAB for validation only
        run: |
          set -euo pipefail
          flutter build apk --release --build-number=1 --build-name=0.0.0 --dart-define=FLUPFLAP_API_BASE_URL=https://example.invalid/api
          flutter build appbundle --release --build-number=1 --build-name=0.0.0 --dart-define=FLUPFLAP_API_BASE_URL=https://example.invalid/api
      - name: Inspect release manifest, native alignment and signature
        run: |
          set -euo pipefail
          mkdir -p build/release-smoke-report
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print build/app/outputs/flutter-apk/app-release.apk > build/release-smoke-report/manifest.xml
          python3 tool/check_android_manifest.py < build/release-smoke-report/manifest.xml
          python3 tool/check_native_alignment.py build/app/outputs/flutter-apk/app-release.apk > build/release-smoke-report/apk-native.json
          python3 tool/check_native_alignment.py --bundle build/app/outputs/bundle/release/app-release.aab > build/release-smoke-report/aab-native.json
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          bundle = Path('build/app/outputs/bundle/release/app-release.aab')
          verification = subprocess.run(['jarsigner', '-J-Duser.language=en', '-J-Duser.country=US',
                                         '-verify', str(bundle)], capture_output=True, text=True, check=True)
          if 'jar verified.' not in verification.stdout:
              raise SystemExit('AAB signature verification failed.')
          Path('build/release-smoke-report/ci-only.json').write_text(json.dumps({
              'purpose': 'release-mode validation only; disposable CI certificate; not for Play upload',
              'commit': os.environ['GITHUB_SHA'],
              'aab_sha256': hashlib.sha256(bundle.read_bytes()).hexdigest(),
              'signature_verified': True,
          }, indent=2) + '\n')
          PY
      - name: Remove disposable signing files
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-release-smoke-report-ci-only
          retention-days: 14
          if-no-files-found: error
          path: apps/flupflap/build/release-smoke-report/

  native-splash:
    name: Native splash screenshot (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: build-test-android
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [30, 31, 36]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4.3.0
        with:
          name: flupflap-android-test-builds
          path: android-builds
      - name: Enable emulator acceleration and screenshot tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pil
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash apps/flupflap/tool/capture_android_splash.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flupflap-native-splash-api-${{ matrix.api }}
          if-no-files-found: error
          path: |
            splash-capture/splash-native.png
            splash-capture/login-native.png
            splash-capture/startup.mp4
            splash-capture/launcher.xml
            splash-capture/launcher.png
