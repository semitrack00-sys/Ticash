name: flupflap
description: FlupFlap recharge customer application. A service by TiCash-App.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ticash:
    path: ../mobile
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.2.0
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/flupflap-logo.png
    - assets/flags/
