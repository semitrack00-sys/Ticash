name: FlupFlap PWA
on:
  push:
    paths: ['apps/flupflap/**', 'apps/mobile/**', '.github/workflows/flupflap-pwa.yml']
  pull_request:
    paths: ['apps/flupflap/**', 'apps/mobile/**', '.github/workflows/flupflap-pwa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/flupflap
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install pillow==11.3.0
      - run: flutter pub get
      - run: flutter analyze
      - name: Capture original bundle screen for comparison
        env:
          FLUPFLAP_SCREENSHOT_DIR: ${{ github.workspace }}/apps/flupflap/build/bundle-screenshots
          FLUPFLAP_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          BUNDLE_SCREENSHOT_PREFIX: before
        run: |
          cp lib/recharge_screen.dart /tmp/recharge-screen-current.dart
          trap 'cp /tmp/recharge-screen-current.dart lib/recharge_screen.dart' EXIT
          git fetch origin 50b06f3027b2143e664d66679acdfd511ee6ca34 --depth=1
          git show 50b06f3027b2143e664d66679acdfd511ee6ca34:apps/flupflap/lib/recharge_screen.dart > lib/recharge_screen.dart
          flutter test test/bundle_screenshots_test.dart
      - name: Run tests and capture redesigned bundle screen
        env:
          FLUPFLAP_SCREENSHOT_DIR: ${{ github.workspace }}/apps/flupflap/build/bundle-screenshots
          FLUPFLAP_TEST_FONT: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
        run: flutter test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flupflap-bundle-screenshots
          path: apps/flupflap/build/bundle-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - run: node --test tool/pwa.test.mjs
      - run: bash tool/build_pwa.sh
      - name: Install fixture-only browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/pwa-browser" playwright@1.52.0
          "$RUNNER_TEMP/pwa-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify browser, offline shell and checkout return
        run: NODE_PATH="$RUNNER_TEMP/pwa-browser/node_modules" node tool/pwa_browser_smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-pwa
          path: apps/flupflap/build/web/
          if-no-files-found: error
          retention-days: 14
