name: FlupFlap Android Build

on:
  push:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'
  pull_request:
    paths:
      - 'apps/flupflap/**'
      - 'apps/mobile/**'
      - '.github/workflows/flupflap-android.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/flupflap

jobs:
  validate:
    name: Analyze and test FlupFlap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-test-android:
    name: Build FlupFlap APK and AAB
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - name: Build AAB
        run: flutter build appbundle --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-android-test-builds
          if-no-files-found: error
          path: |
            apps/flupflap/build/app/outputs/flutter-apk/app-debug.apk
            apps/flupflap/build/app/outputs/bundle/debug/app-debug.aab
