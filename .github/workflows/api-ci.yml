name: API CI

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**', 'schema.prisma', 'package*.json', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/shared/**', 'schema.prisma', 'package*.json', '.github/workflows/api-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ticash:ticash@localhost:5432/ticash
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
