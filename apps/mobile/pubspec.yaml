name: ticash
description: TiCash mobile app - secure remittance and money transfers for Haiti.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Dependency injection
  get_it: ^7.7.0

  # Networking
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # Routing
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.3
  firebase_analytics: ^10.10.5
  firebase_crashlytics: ^3.5.3

  # Secure storage & auth
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.2.0

  # Local persistence / caching
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Camera / KYC verification
  camera: ^0.10.6
  image_picker: ^1.1.2

  # UI / UX
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^4.0.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
