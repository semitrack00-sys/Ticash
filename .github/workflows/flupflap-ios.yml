name: FlupFlap iOS release foundation

on:
  pull_request:
    paths:
      - 'apps/flupflap/**'
      - '.github/workflows/flupflap-ios.yml'
      - '.github/workflows/flupflap-ios-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Build iOS and test native checkout actions
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/flupflap
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - name: Build real iOS simulator app
        run: flutter build ios --simulator --debug --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - name: Test native checkout URL and privacy boundaries
        run: |
          set -euo pipefail
          simulator_id=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO -quiet
      - name: Verify device release compilation without signing
        run: flutter build ios --release --no-codesign --build-name=1.0.4 --build-number=10 --dart-define=FLUPFLAP_API_BASE_URL=https://ticash-api.onrender.com/api
      - uses: actions/upload-artifact@v4
        with:
          name: flupflap-ios-unsigned-review
          retention-days: 7
          if-no-files-found: error
          path: |
            apps/flupflap/build/ios/iphoneos/Runner.app/
            apps/flupflap/build/ios/iphonesimulator/Runner.app/
