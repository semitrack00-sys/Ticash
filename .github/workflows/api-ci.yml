name: API CI

on:
  push:
    branches: [main]
    paths: ['apps/api/**', 'packages/shared/**', 'schema.prisma', 'package*.json', '.github/workflows/api-ci.yml']
  pull_request:
    paths: ['apps/api/**', 'packages/shared/**', 'schema.prisma', 'package*.json', '.github/workflows/api-ci.yml']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ticash:ticash@localhost:5432/ticash
      JWT_ACCESS_SECRET: ci-access-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:validate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  fraud-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fraud_test
          POSTGRES_PASSWORD: local_ci_fixture
          POSTGRES_DB: fraud_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fraud_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://fraud_test:local_ci_fixture@localhost:5432/fraud_test
      FRAUD_TEST_DATABASE_URL: postgresql://fraud_test:local_ci_fixture@localhost:5432/fraud_test
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run test --workspace @ticash/api -- fraud-postgres.test.ts
