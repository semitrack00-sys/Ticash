name: flupflap
description: FlupFlap recharge customer application. A service by TiCash-App.
publish_to: none
version: 0.1.0+3
environment:
  sdk: '>=3.11.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  ticash:
    path: ../mobile
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.2.0
  flutter_localizations:
    sdk: flutter
  dio_web_adapter: ^2.2.1
  web: ^1.1.1
  dio: ^5.4.3+1
  go_router: ^14.2.0
  flutter_secure_storage: ^9.2.2
  phone_numbers_parser: 9.0.27
  country_picker: 2.0.28
dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/flupflap-logo.png
    - assets/flags/
