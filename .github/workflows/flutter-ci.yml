name: Flutter CI

on:
  push:
    paths: ['apps/mobile/**', 'apps/recharge_core/**', '.github/workflows/flutter-ci.yml']
  pull_request:
    paths: ['apps/mobile/**', 'apps/recharge_core/**', '.github/workflows/flutter-ci.yml']

defaults:
  run:
    working-directory: apps/mobile

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - uses: actions/upload-artifact@v4
        with:
          name: ticash-resolved-dependencies
          path: apps/mobile/pubspec.lock
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - run: flutter pub get
      # Release builds intentionally fail without an explicitly configured
      # production keystore. CI validates the reproducible unsigned/debug path.
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS (no codesign)
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter create --platforms=ios .
      - name: Resolve retained TiCash identity SDK from its official podspec
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('ios/Podfile')
          s = p.read_text()
          marker = '  flutter_install_all_ios_pods File.dirname(File.realpath(__FILE__))'
          assert marker in s
          s = s.replace(marker, "  pod 'DiditSDK/AutoDetection', :podspec => 'https://raw.githubusercontent.com/didit-protocol/sdk-ios/4.7.2/DiditSDK.podspec'\n" + marker)
          p.write_text(s)
          PYCODE
      - run: flutter build ios --release --no-codesign
