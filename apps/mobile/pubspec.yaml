name: ticash
description: TiCash mobile app - secure remittance and money transfers for Haiti.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.38.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3+1

  # Routing
  go_router: ^14.2.0

  # Secure token storage
  flutter_secure_storage: ^9.2.2

  # Native Didit flow. The API key remains exclusively on the TiCash backend.
  didit_sdk_autodetection: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/haiti-family-hero.png
    - assets/images/ticash-logo.png
    - assets/images/ticash-app-icon.png
    - assets/images/ticash-lockup.png

  # Note: secrets (API URLs, Firebase config, etc.) must NOT be bundled as
  # assets, since anything in the `assets` list is packaged inside the
  # compiled APK/IPA and can be extracted. Pass build-time configuration via
  # `--dart-define`/`--dart-define-from-file` and read it with
  # `String.fromEnvironment` (see lib/config/api_config.dart).
